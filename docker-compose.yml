services:
  frontend:
    build:
      context: ./frontend
    container_name: lab-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lab-network

  backend:
    build:
      context: ./backend
    container_name: lab-backend
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: lab
      DB_USER: lab
      DB_PASSWORD: lab
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lab-network

  database:
    image: postgres:16-alpine
    container_name: lab-database
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lab-network

  # LAB 2
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.2
    container_name: spire-server
    command:
      - -config
      - /run/spire/config/server.conf
    volumes:
      - ./spire/server.conf:/run/spire/config/server.conf:ro
      - ./spire/server-data:/run/spire/data
    networks:
      - lab-network

  # LAB 2
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.2
    container_name: spire-agent
    command:
      - -config
      - /run/spire/config/agent.conf
    depends_on:
      - spire-server
    volumes:
      - ./spire/agent.conf:/run/spire/config/agent.conf:ro
      - ./spire/agent-data:/run/spire/data
      - ./spire/sockets:/run/spire/sockets
      # LAB 2: needed by WorkloadAttestor "docker"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - lab-network

volumes:
  postgres-data:
  spire-server-data:
  spire-server-socket:
  spire-agent-data:
  spire-agent-socket:

networks:
  lab-network:
    driver: bridge